name: Bilder nach R2 kopieren
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = wirklich hochladen (sonst nur Testlauf)"
        default: "false"
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install boto3 pillow
      - name: Kopieren
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/r2_upload.py ${{ inputs.apply == 'true' && '--apply' || '' }}
      - name: Zuordnung sichern
        if: inputs.apply == 'true'
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/r2_map.json
          if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
          git commit -q -m "R2: Bildzuordnung"
          # main bewegt sich oft (Bots): vor dem Push nachziehen und wiederholen; ein endgueltiger Fehlschlag faellt auf (kein || echo)
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          echo "::error::Zuordnung konnte nicht gesichert werden"; exit 1
