name: Oberflächen-Texte übersetzen (manuell, einmalig, Haiku)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: translate-ui
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Übersetzen (nur Lücken)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/translate_ui.py
      - name: Speichern und Website neu bauen lassen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/ui_js_i18n.json data/ui_js_error.txt)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add -A data && git commit -m "Oberflächen-Texte übersetzt (fr, es, it, nl, pt, pl)"
            git pull --rebase -q && git push -q
            gh workflow run site.yml --ref main
          else
            echo "keine Änderungen"
          fi
