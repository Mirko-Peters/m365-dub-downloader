name: Spreaker werbefrei Test
on:
  workflow_dispatch:
    inputs:
      episode: { description: "Spreaker-Episoden-ID", required: false, default: "75899715" }
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install requests cryptography
      - name: Test
        env:
          SPREAKER_TOKEN: ${{ secrets.SPREAKER_TOKEN }}
          SPREAKER_CLIENT_ID: ${{ secrets.SPREAKER_CLIENT_ID }}
          SPREAKER_CLIENT_SECRET: ${{ secrets.SPREAKER_CLIENT_SECRET }}
        run: python adfree_test.py "${{ inputs.episode }}"
      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          for f in data/adfree_test.json; do [ -e "$f" ] && git add -A "$f"; done
          if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
          git commit -q -m "Werbefrei-Test"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main; then
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i*5))
          done
          echo "::error::Werbefrei-Test konnte nicht gesichert werden"; exit 1
