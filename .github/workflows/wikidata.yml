name: Wikidata-Vorschläge für Entitäten
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Sichere Treffer direkt in data/entities.json eintragen (sonst nur Vorschlagsliste)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wikidata
  cancel-in-progress: false
jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Vorschläge holen
        run: python tools/wikidata_suggest.py ${{ inputs.apply && '--apply' || '' }}
      - name: Ergebnis sichern
        run: |
          if [ -n "$(git status --porcelain data/wikidata_suggestions.json data/entities.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/wikidata_suggestions.json data/entities.json
            git commit -m "Wikidata-Vorschläge aktualisiert${{ inputs.apply && ' (sichere Treffer eingetragen)' || '' }}" -q
            git pull --rebase -q && git push -q
          fi
