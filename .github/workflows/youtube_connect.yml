name: YouTube verbinden (einmalig)
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code von dub.m365.fm/callback (nach 'Zulassen' bei Google)"
        required: true
permissions:
  contents: write
  actions: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests cryptography
      - name: Code gegen Token tauschen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: python yt_auth.py connect "$CODE"
      - name: Speichern und Worker neu ausrollen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/yt_auth.enc && git commit -m "YouTube verbunden (verschlüsselt) [skip ci]"
          git pull --rebase -q && git push -q
          gh workflow run worker.yml --ref main
