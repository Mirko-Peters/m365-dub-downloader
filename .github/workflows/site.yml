name: Website bauen und veröffentlichen
on:
  push:
    branches: [main]
    paths: ["episodes/**", "data/**", "domain.txt", "sync_platforms.py", "scrape_spotify.py", "generate_site.py", "shows_seo.json", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Spotify-Folgenlinks einsammeln (ohne API)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scrape_spotify.py
      - name: Apple-/Spotify-Folgenlinks holen
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python sync_platforms.py
      - run: python generate_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: "Suchmaschinen informieren (IndexNow - Bing, Yandex, Seznam, Naver)"
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          dom = open("domain.txt").read().strip() if os.path.exists("domain.txt") else ""
          base = ("https://" + dom) if dom else os.environ["PAGE_URL"].rstrip("/")
          key = "0348df8af6514d5bae4d9f9a5ba51f57"
          def get(u): return urllib.request.urlopen(u, timeout=60).read().decode()
          urls = []
          for sm in re.findall(r"<loc>(.*?)</loc>", get(base + "/sitemap.xml")):
              urls += re.findall(r"<loc>(.*?)</loc>", get(sm))
          urls = sorted(set(urls))
          host = base.split("//")[1].split("/")[0]
          for i in range(0, len(urls), 9000):
              body = json.dumps({"host": host, "key": key, "keyLocation": f"{base}/{key}.txt", "urlList": urls[i:i + 9000]}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", body, {"Content-Type": "application/json; charset=utf-8"})
              print(urllib.request.urlopen(req, timeout=60).status, len(urls[i:i + 9000]), "URLs gemeldet")
          PY
