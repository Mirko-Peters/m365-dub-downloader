name: Website bauen und veröffentlichen
on:
  push:
    branches: [main]
    paths: ["episodes/**", "data/**", "domain.txt", "sync_platforms.py", "sync_live.py", "site_live.py", "tools/build_speakers.py", "platform_match.py", "show_notes.py", "sync_show_notes.py", "generate_og.py", "site_*.py", "site_taxonomy.py", "check_links.py", "check_schema.py", "assets/**", "generate_articles.py", "scrape_spotify.py", "fetch_en_episodes.py", "fetch_en_titles.py", "fetch_reviews.py", "generate_site.py", "translate_blog.py", "generate_covers.py", "sync_spreaker.py", "spreaker_auth.py", "site_cover.py", "site_design.py", "site_money.py", "site_legal.py", "shows_seo.json", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache fuer Browser und Teilen-Bilder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            .ogcache
          key: build-cache-${{ github.run_id }}
          restore-keys: build-cache-
      - name: Spreaker-Daten holen (Top-Liste, veroeffentlichte Folgen)
        continue-on-error: true
        env:
          SPREAKER_TOKEN: ${{ secrets.SPREAKER_TOKEN }}
          SPREAKER_CLIENT_ID: ${{ secrets.SPREAKER_CLIENT_ID }}
          SPREAKER_CLIENT_SECRET: ${{ secrets.SPREAKER_CLIENT_SECRET }}
        run: |
          pip install requests cryptography
          python sync_spreaker.py
          if [ -n "$(git status --porcelain data/top.json data/published.json data/spreaker_auth.enc)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/top.json data/published.json data/spreaker_auth.enc && git commit -m "Spreaker-Daten aktualisiert"
            git pull --rebase -q && git push -q
          fi
      - name: Englische Original-Titel der Videos holen (YouTube oEmbed)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_titles.py
          if [ -n "$(git status --porcelain data/en_titles.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_titles.json && git commit -m "Englische Original-Titel aktualisiert"
            git pull --rebase -q && git push -q
          fi
      - name: Englische Show - Audio und Transkripte (Spreaker-RSS)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_episodes.py
          if [ -n "$(git status --porcelain data/en_episodes.json data/en_transcripts)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_episodes.json data/en_transcripts && git commit -m "Englische Show: Audio/Transkripte aktualisiert"
            git pull --rebase -q && git push -q
          fi
      - name: Bewertungen einsammeln (Apple Podcasts)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_reviews.py
          if [ -n "$(git status --porcelain data/reviews_ext.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/reviews_ext.json && git commit -m "Bewertungen aktualisiert"
            git pull --rebase -q && git push -q
          fi
      - name: Artikel aus Transkripten schreiben (Claude API)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_LIMIT: "30"
        run: |
          python generate_articles.py
          if [ -n "$(git status --porcelain data/articles)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/articles && git commit -m "Artikel aus Transkripten ergänzt"
            git pull --rebase -q && git push -q
          fi
      - name: Cover-Texte entwerfen (Claude API)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python generate_covers.py
          if [ -n "$(git status --porcelain data/covers)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/covers && git commit -m "Cover-Texte ergänzt"
            git pull --rebase -q && git push -q
          fi
      - name: Spotify-Folgenlinks einsammeln (ohne API) – nur täglich/manuell, bei Pushes gilt der gespeicherte Stand
        if: github.event_name != 'push'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scrape_spotify.py
          if [ -n "$(git status --porcelain data/spotify_links.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/spotify_links.json && git commit -m "Spotify-Folgenlinks aktualisiert" && git pull --rebase -q && git push -q || true
          fi
      - name: Speaker der Events zusammenfuehren (Personen-Entitaeten, Sessions)
        run: python tools/build_speakers.py
      - name: Show Notes aus Spreaker holen (taeglich, nicht bei jedem Push)
        if: github.event_name != 'push' || hashFiles('data/show_notes/*.json') == ''
        continue-on-error: true
        run: |
          python sync_show_notes.py
          if [ -n "$(git status --porcelain data/show_notes)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/show_notes && git commit -m "Show Notes aus Spreaker aktualisiert" -q
            git pull --rebase -q && git push -q
          fi
      - name: M365 Show (Livestreams) von YouTube holen
        timeout-minutes: 8
        continue-on-error: true
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          pip install -q yt-dlp
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          python sync_live.py
          rm -f cookies.txt
          if [ -n "$(git status --porcelain data/live.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/live.json && git commit -m "M365 Show: Streams aktualisiert" -q
            git pull --rebase -q && git push -q
          fi
      - name: Folgenlinks zu Apple, Spotify, Deezer, YouTube zuordnen (taeglich/manuell, bei Pushes gilt der gespeicherte Stand)
        if: github.event_name != 'push'
        timeout-minutes: 15
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          pip install -q yt-dlp ytmusicapi
          python sync_platforms.py
          if [ -n "$(git status --porcelain data/episode_links.json data/episode_links_report.json data/platforms.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/episode_links.json data/episode_links_report.json data/platforms.json && git commit -m "Plattform-Folgenlinks aktualisiert" -q
            git pull --rebase -q && git push -q
          fi
      - run: python generate_site.py
      - name: Pruefung - Profilseiten vorhanden?
        run: |
          n=$(ls -d docs/community/u/*/ 2>/dev/null | wc -l)
          echo "Profilseiten: $n"
          if [ ! -f docs/community/u/mirko-peters/index.html ]; then echo "::warning::Profilseite mirko-peters fehlt (Profil-Export fehlgeschlagen oder Profil nicht oeffentlich), siehe Zeile 'Profil-Export' im Log oben"; fi
      - name: Money-Keywords und Profil-Export sichern
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/money_keywords.json data/members_export.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/money_keywords.json data/members_export.json && git commit -m "Money-Keywords und Profil-Export aktualisiert"
            git pull --rebase -q && git push -q || true
          fi
      - name: Interne Links prüfen
        continue-on-error: true
        run: python check_links.py
      - name: Schema.org (JSON-LD) prüfen
        continue-on-error: true
        run: python check_schema.py
      - name: Teilen-Bilder (Open Graph) erzeugen
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk fonts-noto-extra >/dev/null 2>&1 || true
          pip install playwright
          playwright install chromium
          python generate_og.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Cloudflare-Cache leeren (falls dub.m365.fm ueber Cloudflare laeuft)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "Kein Cloudflare-Token - uebersprungen"; exit 0; }
          if [ -z "$CF_ZONE_ID" ]; then
            CF_ZONE_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=m365.fm" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result') or [];print(r[0]['id'] if r else '')")
          fi
          [ -z "$CF_ZONE_ID" ] && { echo "::warning::Zone-ID nicht gefunden (Token braucht Zone:Read, Cache Purge) - Secret CF_ZONE_ID setzen"; exit 0; }
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" | python3 -c "import sys,json;d=json.load(sys.stdin);print('Cache geleert:',d.get('success'),[e.get('message') for e in d.get('errors',[])])"
      - uses: actions/checkout@v4
      - name: "Suchmaschinen informieren (IndexNow - Bing, Yandex, Seznam, Naver)"
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          dom = open("domain.txt").read().strip() if os.path.exists("domain.txt") else ""
          base = ("https://" + dom) if dom else os.environ["PAGE_URL"].rstrip("/")
          key = "0348df8af6514d5bae4d9f9a5ba51f57"
          def get(u): return urllib.request.urlopen(u, timeout=60).read().decode()
          urls = []
          for sm in re.findall(r"<loc>(.*?)</loc>", get(base + "/sitemap.xml")):
              urls += re.findall(r"<loc>(.*?)</loc>", get(sm))
          urls = sorted(set(urls))
          host = base.split("//")[1].split("/")[0]
          for i in range(0, len(urls), 9000):
              body = json.dumps({"host": host, "key": key, "keyLocation": f"{base}/{key}.txt", "urlList": urls[i:i + 9000]}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", body, {"Content-Type": "application/json; charset=utf-8"})
              print(urllib.request.urlopen(req, timeout=60).status, len(urls[i:i + 9000]), "URLs gemeldet")
          PY
