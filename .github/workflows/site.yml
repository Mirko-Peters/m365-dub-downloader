name: Website bauen und veröffentlichen
on:
  push:
    branches: [main]
    paths: ["episodes/**", "data/**", "domain.txt", "sync_platforms.py", "sync_live.py", "site_live.py", "tools/build_speakers.py", "platform_match.py", "show_notes.py", "sync_show_notes.py", "generate_og.py", "site_*.py", "site_taxonomy.py", "check_links.py", "check_schema.py", "assets/**", "generate_articles.py", "scrape_spotify.py", "fetch_en_episodes.py", "fetch_en_titles.py", "fetch_reviews.py", "generate_site.py", "translate_blog.py", "generate_covers.py", "sync_spreaker.py", "spreaker_auth.py", "site_cover.py", "site_design.py", "site_money.py", "site_legal.py", "shows_seo.json", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: site-build
      cancel-in-progress: true   # ein neuer Push ersetzt den laufenden Bau (vorher: 29 von 60 Laeufen von Hand abgebrochen)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache fuer den Browser (fester Schluessel, einmal gefuellt)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Cache fuer Teilen-Bilder (rollierend)
        uses: actions/cache@v4
        with:
          path: .ogcache
          key: ogcache-${{ github.run_id }}
          restore-keys: ogcache-
      - name: Cache fuer die Community-Exporte (letzte erreichbare Fassung je Endpunkt, siehe site_fetch.py)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: exports-${{ github.run_id }}
          restore-keys: exports-
      - name: Spreaker-Daten holen (Top-Liste, veroeffentlichte Folgen)
        continue-on-error: true
        env:
          SPREAKER_TOKEN: ${{ secrets.SPREAKER_TOKEN }}
          SPREAKER_CLIENT_ID: ${{ secrets.SPREAKER_CLIENT_ID }}
          SPREAKER_CLIENT_SECRET: ${{ secrets.SPREAKER_CLIENT_SECRET }}
        run: |
          pip install requests cryptography
          python sync_spreaker.py
          if [ -n "$(git status --porcelain data/top.json data/published.json data/spreaker_auth.enc)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/top.json data/published.json data/spreaker_auth.enc && git commit -m "Spreaker-Daten aktualisiert"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Englische Original-Titel der Videos holen (YouTube oEmbed)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_titles.py
          if [ -n "$(git status --porcelain data/en_titles.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_titles.json && git commit -m "Englische Original-Titel aktualisiert"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Englische Show - Audio und Transkripte (Spreaker-RSS)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_episodes.py
          if [ -n "$(git status --porcelain data/en_episodes.json data/en_transcripts)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_episodes.json data/en_transcripts && git commit -m "Englische Show: Audio/Transkripte aktualisiert"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Bewertungen einsammeln (Apple Podcasts)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_reviews.py
          if [ -n "$(git status --porcelain data/reviews_ext.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/reviews_ext.json && git commit -m "Bewertungen aktualisiert"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Spotify-Folgenlinks einsammeln (ohne API) – nur täglich/manuell, bei Pushes gilt der gespeicherte Stand
        if: github.event_name != 'push'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scrape_spotify.py
          if [ -n "$(git status --porcelain data/spotify_links.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/spotify_links.json && git commit -m "Spotify-Folgenlinks aktualisiert" && (git pull --rebase -q -X theirs || git rebase --abort) && git push -q || true
          fi
      - name: Speaker der Events zusammenfuehren (Personen-Entitaeten, Sessions)
        run: python tools/build_speakers.py
      - name: Show Notes aus Spreaker holen (taeglich, nicht bei jedem Push)
        if: github.event_name != 'push' || hashFiles('data/show_notes/*.json') == ''
        continue-on-error: true
        run: |
          python sync_show_notes.py
          if [ -n "$(git status --porcelain data/show_notes)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/show_notes && git commit -m "Show Notes aus Spreaker aktualisiert" -q
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: M365 Show (Livestreams) von YouTube holen
        timeout-minutes: 8
        continue-on-error: true
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          pip install -q yt-dlp
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          python sync_live.py
          rm -f cookies.txt
          if [ -n "$(git status --porcelain data/live.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/live.json && git commit -m "M365 Show: Streams aktualisiert" -q
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
      - name: Folgenlinks zu Apple, Spotify, Deezer, YouTube zuordnen (taeglich/manuell, bei Pushes gilt der gespeicherte Stand)
        if: github.event_name != 'push'
        timeout-minutes: 15
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          pip install -q yt-dlp ytmusicapi
          python sync_platforms.py
          if [ -n "$(git status --porcelain data/episode_links.json data/episode_links_report.json data/platforms.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/episode_links.json data/episode_links_report.json data/platforms.json && git commit -m "Plattform-Folgenlinks aktualisiert" -q
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
      - run: python generate_site.py
      - name: Seiten in den R2-Bucket laden (duenne Sprachfassungen; GitHub Pages bleibt klein, nichts wird geloescht)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q boto3
          python tools/r2_pages_upload.py r2out
      - name: Pruefung - Profilseiten vorhanden?
        run: |
          n=$(ls -d docs/community/u/*/ 2>/dev/null | wc -l)
          echo "Profilseiten: $n"
          if [ ! -f docs/community/u/mirko-p/index.html ]; then echo "::warning::Profilseite mirko-p fehlt (Profil-Export fehlgeschlagen oder Profil nicht oeffentlich), siehe Zeile 'Profil-Export' im Log oben"; fi
      - name: Money-Keywords und Profil-Export sichern
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/money_keywords.json data/members_export.json data/entity_mod.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/money_keywords.json data/members_export.json data/entity_mod.json && git commit -m "Money-Keywords, Profil-Export und Entitaets-Aenderungsdaten aktualisiert"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q || true
          fi
      - name: Interne Links prüfen
        continue-on-error: true
        run: python check_links.py
      - name: Schema.org (JSON-LD) prüfen
        continue-on-error: true
        run: python check_schema.py
      - name: Sitemaps prüfen (blockierend)
        run: python check_sitemaps.py
      - name: Encoding prüfen (Mojibake blockierend)
        run: python check_encoding.py
      - name: Teilen-Bilder (Open Graph) erzeugen
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk fonts-noto-extra >/dev/null 2>&1 || true
          pip install playwright
          playwright install chromium
          python generate_og.py
      - name: Seiten-Hashes (fuer gezieltes Purge und IndexNow)
        run: python tools/page_hashes.py docs page-hashes.json
      - uses: actions/upload-artifact@v4
        with: { name: page-hashes, path: page-hashes.json, retention-days: 3 }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Letzter Seiten-Stand (Hashes des vorigen Deploys)
        uses: actions/cache@v4
        with:
          path: .pagehashes
          key: page-hashes-${{ github.run_id }}
          restore-keys: page-hashes-
      - uses: actions/download-artifact@v4
        with: { name: page-hashes, path: .newhashes }
      - name: "Cloudflare-Cache nur fuer geaenderte Adressen leeren, IndexNow nur fuer Aenderungen (Bing, Yandex, Seznam, Naver)"
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          INDEXNOW_KEY: 0348df8af6514d5bae4d9f9a5ba51f57
          BASE: https://www.m365.fm
        run: |
          mkdir -p .pagehashes
          python3 tools/purge_changed.py .pagehashes/page-hashes.json .newhashes/page-hashes.json
          cp .newhashes/page-hashes.json .pagehashes/page-hashes.json
