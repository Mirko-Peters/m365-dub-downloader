name: Website bauen und veröffentlichen
on:
  push:
    branches: [main]
    paths: ["episodes/**", "data/**", "domain.txt", "sync_platforms.py", "generate_og.py", "site_*.py", "site_taxonomy.py", "check_links.py", "check_schema.py", "assets/**", "generate_articles.py", "scrape_spotify.py", "fetch_en_episodes.py", "generate_site.py", "generate_covers.py", "sync_spreaker.py", "spreaker_auth.py", "site_cover.py", "site_design.py", "site_money.py", "site_legal.py", "shows_seo.json", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Spreaker-Daten holen (Top-Liste, veroeffentlichte Folgen)
        continue-on-error: true
        env:
          SPREAKER_TOKEN: ${{ secrets.SPREAKER_TOKEN }}
          SPREAKER_CLIENT_ID: ${{ secrets.SPREAKER_CLIENT_ID }}
          SPREAKER_CLIENT_SECRET: ${{ secrets.SPREAKER_CLIENT_SECRET }}
        run: |
          pip install requests cryptography
          python sync_spreaker.py
          if [ -n "$(git status --porcelain data/top.json data/published.json data/spreaker_auth.enc)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/top.json data/published.json data/spreaker_auth.enc && git commit -m "Spreaker-Daten aktualisiert"
            git pull --rebase -q && git push -q
          fi
      - name: Englische Show - Audio und Transkripte (Spreaker-RSS)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python fetch_en_episodes.py
          if [ -n "$(git status --porcelain data/en_episodes.json data/en_transcripts)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/en_episodes.json data/en_transcripts && git commit -m "Englische Show: Audio/Transkripte aktualisiert"
            git pull --rebase -q && git push -q
          fi
      - name: Artikel aus Transkripten schreiben (Claude API)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_LIMIT: "30"
        run: |
          python generate_articles.py
          if [ -n "$(git status --porcelain data/articles)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/articles && git commit -m "Artikel aus Transkripten ergänzt"
            git pull --rebase -q && git push -q
          fi
      - name: Cover-Texte entwerfen (Claude API)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python generate_covers.py
          if [ -n "$(git status --porcelain data/covers)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/covers && git commit -m "Cover-Texte ergänzt"
            git pull --rebase -q && git push -q
          fi
      - name: Spotify-Folgenlinks einsammeln (ohne API) – nur täglich/manuell, bei Pushes gilt der gespeicherte Stand
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scrape_spotify.py
          if [ -n "$(git status --porcelain data/spotify_links.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/spotify_links.json && git commit -m "Spotify-Folgenlinks aktualisiert" && git pull --rebase -q && git push -q || true
          fi
      - name: Apple-/Spotify-Folgenlinks holen
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python sync_platforms.py
      - run: python generate_site.py
      - name: Money-Keyword-Liste sichern
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/money_keywords.json)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/money_keywords.json && git commit -m "Money-Keywords aktualisiert"
            git pull --rebase -q && git push -q || true
          fi
      - name: Interne Links prüfen
        continue-on-error: true
        run: python check_links.py
      - name: Schema.org (JSON-LD) prüfen
        continue-on-error: true
        run: python check_schema.py
      - name: Teilen-Bilder (Open Graph) erzeugen
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk fonts-noto-extra >/dev/null 2>&1 || true
          pip install playwright
          playwright install chromium
          python generate_og.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: "Suchmaschinen informieren (IndexNow - Bing, Yandex, Seznam, Naver)"
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          dom = open("domain.txt").read().strip() if os.path.exists("domain.txt") else ""
          base = ("https://" + dom) if dom else os.environ["PAGE_URL"].rstrip("/")
          key = "0348df8af6514d5bae4d9f9a5ba51f57"
          def get(u): return urllib.request.urlopen(u, timeout=60).read().decode()
          urls = []
          for sm in re.findall(r"<loc>(.*?)</loc>", get(base + "/sitemap.xml")):
              urls += re.findall(r"<loc>(.*?)</loc>", get(sm))
          urls = sorted(set(urls))
          host = base.split("//")[1].split("/")[0]
          for i in range(0, len(urls), 9000):
              body = json.dumps({"host": host, "key": key, "keyLocation": f"{base}/{key}.txt", "urlList": urls[i:i + 9000]}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", body, {"Content-Type": "application/json; charset=utf-8"})
              print(urllib.request.urlopen(req, timeout=60).status, len(urls[i:i + 9000]), "URLs gemeldet")
          PY
