name: Site-Worker (Cloudflare vor der Seite) veroeffentlichen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sitewrk/**", ".github/workflows/sitewrk.yml"]
concurrency: { group: sitewrk, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy
        working-directory: sitewrk
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
