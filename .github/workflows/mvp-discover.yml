name: MVP-Verzeichnis erkunden (T31)
# Einmalige Erkundung: welche Schnittstelle nutzt die MVP-Suche, was sagen robots.txt und Nutzungsbedingungen.
# Schreibt nur Technik (keine Personendaten) nach reports/mvp-discovery.md/.json.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mvp-discover
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python tools/mvp_discover.py
      - name: Bericht speichern
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mvp-discovery.md reports/mvp-discovery.json
          git diff --cached --quiet && exit 0
          git commit -m "Erkundung MVP-Verzeichnis (T31)"
          for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
