name: YouTube-Dubs zu Spreaker

on:
  schedule:
    - cron: "17 2 * * *"      # täglich 03:17 MEZ
  workflow_dispatch:
    inputs:
      limit:
        description: "Nur die neuesten N Videos prüfen (leer = alle)"
        required: false
        default: ""
      dry_run:
        description: "Nur anzeigen, nichts laden/hochladen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dubs
  cancel-in-progress: false

jobs:
  dubs:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Pakete installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U yt-dlp requests

      - name: YouTube-Cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; echo "Cookies gesetzt"; else echo "Keine Cookies"; fi

      - name: Dubs laden und hochladen
        env:
          SPREAKER_TOKEN: ${{ secrets.SPREAKER_TOKEN }}
          CLOUD_MODE: "1"
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python yt_dub_to_spreaker.py download $ARGS

      - name: Fortschritt speichern
        if: always()
        run: |
          rm -f cookies.txt
          git config user.name "dub-bot"
          git config user.email "dub-bot@users.noreply.github.com"
          git add state.json config.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Dub-Status aktualisiert" && git push || true

      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: logs/
          retention-days: 14
