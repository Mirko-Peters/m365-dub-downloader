name: Cache-Check (nur lesen)
# Misst die Cache-Header der Seite und liest die Cache-Einstellungen der Cloudflare-Zone. Aendert nichts, gibt keine Secrets aus.
on:
  workflow_dispatch:
  push:
    branches: [ticket/41-cache]
    paths: [.github/workflows/cache-check.yml, tools/cache_check.py]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Header messen, Zone lesen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python3 tools/cache_check.py | tee -a "$GITHUB_STEP_SUMMARY"
