name: Podpage-Blog holen
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Nur die ersten N (Test)", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: fetch-blog, cancel-in-progress: false }
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python fetch_podpage_blog.py "${{ inputs.limit }}" 2>&1 | tail -20 > data/podpage/blog_fetch.log; test -s data/podpage/blog_posts.json.gz
      - name: committen   # T32: nur nach erfolgreichem Abruf (vorher if: always() - hat auch eine leere Sicherung committet)
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          for f in data/podpage/blog_posts.json.gz data/podpage/blog_fetch.log; do [ -e "$f" ] && git add -A "$f"; done
          if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
          git commit -q -m "Podpage-Blog geholt"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main; then
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i*5))
          done
          echo "::error::Podpage-Blog konnte nicht gesichert werden"; exit 1
