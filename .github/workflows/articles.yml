name: Artikel und Cover nachziehen (stündlich, wenige)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: articles
  cancel-in-progress: false
jobs:
  articles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Artikel schreiben (wenige pro Lauf)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_LIMIT: "12"
          ARTICLE_WORKERS: "4"
        run: python generate_articles.py
      - name: Cover-Texte entwerfen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COVER_LIMIT: "60"
        run: python generate_covers.py
      - name: Speichern und Website neu bauen lassen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/articles data/covers)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/articles data/covers && git commit -m "Artikel/Cover ergänzt (stündlich)"
            git pull --rebase -q && git push -q
            gh workflow run site.yml --ref main
          else
            echo "Nichts Neues"
          fi
