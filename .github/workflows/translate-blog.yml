name: Blog uebersetzen (Uebersetzer-Team, 14 Sprachen)
# Gesteuert vom Projektmanager (agents/blog-team/projektmanager.md). Kosten: Claude Haiku im Message Batch, Budget-Deckel BLOG_BUDGET_USD.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = nur Status/Kosten, pilot = 3 neueste Artikel je Sprache, run = Auftrag ausfuehren, collect = fertige Batches abholen, sample = Stichprobe fuer Reviews"
        type: choice
        options: [plan, pilot, run, collect, sample]
        default: plan
      langs: { description: "Sprachen, kommagetrennt (leer = alle 14)", required: false, default: "" }
      queue: { description: "Nur die in der Verwaltung (/admin/ -> Uebersetzungen) vorgemerkten Beitraege und Sprachen", type: boolean, required: false, default: false }
      limit: { description: "Artikel je Sprache (leer = alle offenen)", required: false, default: "" }
      order: { description: "newest oder oldest", required: false, default: "newest" }
      slugs: { description: "Nur diese Artikel (Slugs, kommagetrennt)", required: false, default: "" }
      redo: { description: "Gewaehlte Artikel neu uebersetzen (nach Glossar-Aenderung)", type: boolean, default: false }
      budget: { description: "Gesamtbudget in USD (leer = Repo-Variable BLOG_BUDGET_USD, sonst 10)", required: false, default: "" }
  schedule:
    - cron: "43 */3 * * *"   # alle 3 h: fertige Batches abholen; mit BLOG_AUTO=true auch neue Artikel der letzten 14 Tage uebersetzen
permissions:
  contents: write
  actions: write
concurrency: { group: translate-blog, cancel-in-progress: false }
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Uebersetzer-Team arbeiten lassen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BLOG || secrets.ANTHROPIC_API_KEY_SHOW }}
          BLOG_BUDGET_USD: ${{ inputs.budget || vars.BLOG_BUDGET_USD || '10' }}
          MODE_IN: ${{ inputs.mode || 'scheduled' }}
          AUTO: ${{ vars.BLOG_AUTO }}
          LANGS_IN: ${{ inputs.langs }}
          LIMIT_IN: ${{ inputs.limit }}
          ORDER_IN: ${{ inputs.order }}
          SLUGS_IN: ${{ inputs.slugs }}
          REDO_IN: ${{ inputs.redo }}
          QUEUE_IN: ${{ inputs.queue }}
        run: |
          ARGS=""
          [ "$QUEUE_IN" = "true" ] && ARGS="$ARGS --queue"
          [ -n "$LANGS_IN" ] && ARGS="$ARGS --langs $LANGS_IN"
          [ -n "$ORDER_IN" ] && ARGS="$ARGS --order $ORDER_IN"
          [ -n "$SLUGS_IN" ] && ARGS="$ARGS --slugs $SLUGS_IN"
          [ "$REDO_IN" = "true" ] && ARGS="$ARGS --redo"
          MODE="$MODE_IN"
          if [ "$MODE" = "scheduled" ]; then
            if [ "$AUTO" = "true" ]; then MODE=auto; export WAIT_MIN=60; else MODE=collect; fi
          fi
          if [ "$MODE" = "pilot" ]; then MODE=run; ARGS="$ARGS --limit 3"
          elif [ -n "$LIMIT_IN" ]; then ARGS="$ARGS --limit $LIMIT_IN"; fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ "$MODE" != "plan" ] && [ "$MODE" != "sample" ]; then
            echo "Kein API-Schluessel (Secret ANTHROPIC_API_KEY_BLOG oder ANTHROPIC_API_KEY_SHOW) - nur Status."; MODE=plan
          fi
          if [ "$MODE" = "collect" ] && [ ! -s data/blog_i18n/batches.json -o "$(cat data/blog_i18n/batches.json 2>/dev/null)" = "[]" ]; then
            echo "Keine offenen Batches."; exit 0
          fi
          echo "Modus: $MODE $ARGS"
          python translate_blog.py $MODE $ARGS
          python -c "import json;s=json.load(open('data/blog_i18n/status.json'));print('## Uebersetzer-Team\n\nAusgegeben **%s \$** von %s \$ · offen geschaetzt %s \$\n\n| Sprache | fertig | %% |\n|---|---|---|' % (s['spent_usd'], s['budget_usd'], s['rest_est_usd_all']));[print('| %s | %d/%d | %s |' % (v['name'], v['done'], s['posts'], v['pct'])) for v in s['langs'].values()]" >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis committen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/blog_i18n)" ]; then
            git config user.name "m365-site-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/blog_i18n && git commit -q -m "Blog-Uebersetzungen (Uebersetzer-Team)"
            (git pull --rebase -q -X theirs || git rebase --abort) && git push -q
          fi
