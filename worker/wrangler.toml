name = "m365-dub-community"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [{ pattern = "api.dub.m365.fm", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "m365-dub"
database_id = "REPLACE_WITH_D1_ID"   # wird vom Workflow (worker.yml) automatisch eingetragen

[triggers]
crons = ["0 6 * * *"]               # taeglicher Digest, 06:00 UTC

[vars]
SITE = "https://dub.m365.fm"
API = "https://api.dub.m365.fm"
MAIL_FROM = "M365.FM <news@dub.m365.fm>"
VAPID_SUBJECT = "mailto:news@dub.m365.fm"
